<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFD700">
  <link rel="manifest" href="./manifest.json">
  <title>Useless Knowledge</title>
  <style>
    :root {
      --blue: #1a1aff;
      --magenta: #cc00cc;
      --gold: #ffd700;
      --cream: #fffde7;
      --ink: #1b1026;
      --red: #ff1744;
      --green: #13a538;
      --purple: #7b1bff;
      --orange: #ff8a00;
      --shadow: #221042;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--blue);
      background-image: url('./images/memphis-bg.svg');
      background-size: 200px 200px;
      overflow-x: hidden;
    }

    .app {
      width: min(940px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 14px 14px 24px;
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      gap: 14px;
    }

    /* ── Scoreboard ── */
    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border: 5px solid var(--ink);
      background: var(--gold);
      box-shadow: 0 7px 0 var(--shadow);
      font-family: Impact, "Arial Black", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .score-main { font-size: 24px; }

    .scoreboard-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .seen-count { font-size: 16px; white-space: nowrap; }

    .version-badge {
      font-size: 11px;
      color: rgba(27,16,38,0.55);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .streak-display {
      font-family: Impact, "Arial Black", Arial, sans-serif;
      font-size: 18px;
      white-space: nowrap;
    }

    /* ── Category pills ── */
    .category-strip {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      scrollbar-color: var(--gold) var(--ink);
    }

    .category-strip::-webkit-scrollbar { height: 5px; }
    .category-strip::-webkit-scrollbar-track { background: var(--ink); }
    .category-strip::-webkit-scrollbar-thumb { background: var(--gold); }

    .pill {
      flex: 0 0 auto;
      border: 4px solid var(--gold);
      border-bottom-width: 7px;
      border-radius: 999px;
      background: var(--cream);
      color: var(--ink);
      padding: 7px 14px;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 120ms ease, border-bottom-width 120ms ease;
      white-space: nowrap;
    }

    .pill.active {
      background: var(--gold);
      border-color: var(--ink);
    }

    .pill:active { transform: translateY(3px); border-bottom-width: 3px; }

    /* ── Stage ── */
    .stage {
      display: grid;
      place-items: center;
      min-height: 430px;
    }

    .fact-card {
      width: min(720px, 100%);
      min-height: 390px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      padding: clamp(22px, 5vw, 42px);
      border: 6px solid var(--red);
      border-left-color: var(--green);
      border-right-color: var(--purple);
      border-bottom: 12px solid var(--shadow);
      border-radius: 18px;
      background: var(--cream);
      box-shadow: 14px 16px 0 rgba(0,0,0,0.35);
      transform: rotate(-1deg);
      position: relative;
      overflow: hidden;
    }

    .fact-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 3px dashed rgba(255,23,68,0.35);
      border-radius: 12px;
      pointer-events: none;
    }

    .fact-card.quiz {
      background: #24105f;
      color: #fff;
      border-color: var(--gold);
      transform: rotate(1deg);
    }

    .category-badge {
      align-self: flex-start;
      padding: 7px 12px;
      border: 4px solid var(--ink);
      background: var(--gold);
      font-family: Impact, "Arial Black", Arial, sans-serif;
      text-transform: uppercase;
      font-size: 16px;
      z-index: 1;
    }

    .fact-image {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border: 5px solid var(--ink);
      background: #fff;
      z-index: 1;
    }

    .fact-text, .quiz-prompt {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 900;
      font-size: clamp(26px, 5vw, 42px);
      line-height: 1.08;
      text-wrap: balance;
      z-index: 1;
    }

    .why-line {
      margin: 0;
      color: #c95000;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.35;
      z-index: 1;
    }

    .quiz-answer {
      display: none;
      padding: 14px;
      border: 4px solid var(--gold);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 20px;
      line-height: 1.35;
      z-index: 1;
      animation: revealPop 240ms ease-out;
    }

    .quiz-answer.show { display: block; }

    .card-actions { display: grid; gap: 12px; z-index: 1; }

    /* ── Controls — two-line buttons ── */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 10px;
    }

    .buzzer {
      border: 4px solid var(--ink);
      border-bottom: 8px solid rgba(0,0,0,0.45);
      border-radius: 14px;
      color: #fff;
      padding: 10px 10px;
      min-height: 58px;
      font-family: Impact, "Arial Black", Arial, sans-serif;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 120ms ease, border-bottom-width 120ms ease, filter 120ms ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .buzzer:hover { filter: saturate(1.2) brightness(1.05); }
    .buzzer:active { transform: translateY(3px); border-bottom-width: 3px; }

    .btn-icon { font-size: 20px; line-height: 1; }
    .btn-label { font-size: 13px; line-height: 1; letter-spacing: 0.04em; }

    .prev { background: #1065ff; }
    .random { background: var(--red); }
    .next { background: var(--green); }
    .quiz-button { background: var(--purple); width: 100%; }
    .back-button { background: var(--orange); }
    .share { background: var(--magenta); }
    .share-row { margin-top: 0; }

    .reveal-button {
      background: var(--red);
      animation: pulseGlow 1200ms ease-in-out infinite;
    }

    .empty-state {
      padding: 24px;
      border: 5px solid var(--ink);
      background: var(--cream);
      font-family: "Arial Black", Arial, sans-serif;
      text-align: center;
      box-shadow: 0 8px 0 var(--shadow);
    }

    /* ── Attribution footer ── */
    .attr-footer {
      text-align: center;
      padding: 10px 0 4px;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .attr-footer a {
      color: var(--gold);
      text-decoration: none;
      opacity: 0.75;
    }

    .attr-footer a:hover { opacity: 1; }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(255,215,0,0); }
      50% { box-shadow: 0 0 22px rgba(255,215,0,0.9); }
    }

    @keyframes revealPop {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 620px) {
      .app { padding: 10px; }
      .scoreboard { align-items: flex-start; flex-direction: column; }
      .score-main { font-size: 21px; }
      .stage { min-height: 390px; }
      .fact-card { min-height: 350px; transform: none; }
      .controls { grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
      .btn-label { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-live="polite">

    <header class="scoreboard">
      <div class="score-main" id="progressText">Loading facts...</div>
      <div class="scoreboard-right">
        <div class="seen-count" id="seenCount">Seen today: 0</div>
        <div class="streak-display" id="streakDisplay" title="Days in a row">🔥 <span id="streakCount">1</span></div>
        <div class="version-badge" id="versionBadge"></div>
      </div>
    </header>

    <nav class="category-strip" id="categoryStrip" aria-label="Fact categories"></nav>

    <section class="stage" id="stage"></section>

    <section class="controls" aria-label="Fact navigation">
      <button class="buzzer prev" id="prevButton" type="button">
        <span class="btn-icon">&larr;</span>
        <span class="btn-label">Prev</span>
      </button>
      <button class="buzzer random" id="randomButton" type="button">
        <span class="btn-icon">&#9733;</span>
        <span class="btn-label">Random</span>
      </button>
      <button class="buzzer next" id="nextButton" type="button">
        <span class="btn-icon">&rarr;</span>
        <span class="btn-label">Next</span>
      </button>
    </section>

    <div class="share-row">
      <button class="buzzer share" id="shareButton" type="button" onclick="shareApp()" style="width:100%;">
        <span class="btn-icon">&#8679;</span>
        <span class="btn-label">Share</span>
      </button>
    </div>

    <footer class="attr-footer">
      Built by Justin Ache &nbsp;
      <a href="https://justinache.com" target="_blank" rel="noopener">JustinAche.com</a>
    </footer>

  </main>

  <script>
    const APP_VERSION = "1.3";
    document.addEventListener("DOMContentLoaded", () => {
      const badge = document.getElementById("versionBadge");
      if (badge) badge.textContent = "v" + APP_VERSION;
    });

    const fallbackFacts = [
      { id:1, category:"math-tricks", fact:"To estimate Celsius in Fahrenheit, double it and add 30.", why:"Fast weather math when someone gives you the wrong temperature scale.", quizPrompt:"About what is 20°C in Fahrenheit using the quick estimate?", quizAnswer:"Double 20 to get 40, then add 30. The estimate is 70°F.", image:null, imageAlt:null, tags:["conversion","temperature","mental-math"] },
      { id:7, category:"math-tricks", fact:"Divisibility by 3: add the digits — if their sum is divisible by 3, so is the number.", why:"You can sanity-check totals and spot mistakes fast.", quizPrompt:"Is 1,248 divisible by 3?", quizAnswer:"1+2+4+8 = 15, and 15 ÷ 3 = 5. Yes.", image:null, imageAlt:null, tags:["division","numbers","mental-math"] },
      { id:13, category:"navigation", fact:"Moss is not a reliable compass — it grows where it is damp and shaded.", why:"Moisture and shade matter more than north.", quizPrompt:"Why should you not use moss as your only direction clue?", quizAnswer:"Because moss follows moisture and shade more than compass direction.", image:null, imageAlt:null, tags:["outdoors","direction","survival"] },
      { id:20, category:"nature", fact:"Every 5 seconds between lightning and thunder equals about 1 mile of distance.", why:"You can tell whether a storm is leaving, arriving, or already in your lap.", quizPrompt:"Thunder comes 10 seconds after lightning. How far away is the strike?", quizAnswer:"About 2 miles.", image:null, imageAlt:null, tags:["weather","lightning","outdoors"] },
      { id:59, category:"misc", fact:"The ridges on the edge of a coin are called reeding.", why:"They originally made it obvious if someone had shaved precious metal off the edge.", quizPrompt:"What are the ridges on a coin edge called?", quizAnswer:"Reeding.", image:null, imageAlt:null, tags:["money","history","objects"] }
    ];

    const CATEGORY_LABELS = {
      "math-tricks": "Math Tricks",
      "navigation": "Navigation",
      "nature": "Nature",
      "body": "Body",
      "food-cooking": "Food & Cooking",
      "history-geography": "History & Geo",
      "visual-skills": "Visual Skills",
      "misc": "Misc"
    };

    let allFacts = [];
    let filteredFacts = [];
    let currentIndex = 0;
    let activeCategory = "all";
    let seenToday = new Set();
    let quizMode = false;

    async function loadFacts() {
      try {
        const res = await fetch("./facts.json");
        if (!res.ok) throw new Error("fetch failed");
        allFacts = await res.json();
      } catch {
        allFacts = fallbackFacts;
      }
      applyFilter("all");
      buildCategoryStrip();
    }

    function buildCategoryStrip() {
      const strip = document.getElementById("categoryStrip");
      strip.innerHTML = "";
      const categories = ["all", ...Object.keys(CATEGORY_LABELS)];
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "pill" + (cat === activeCategory ? " active" : "");
        btn.textContent = cat === "all" ? "All Facts" : (CATEGORY_LABELS[cat] || cat);
        btn.type = "button";
        btn.addEventListener("click", () => {
          activeCategory = cat;
          applyFilter(cat);
          buildCategoryStrip();
        });
        strip.appendChild(btn);
      });
    }

    function applyFilter(cat) {
      activeCategory = cat;
      filteredFacts = cat === "all" ? [...allFacts] : allFacts.filter(f => f.category === cat);
      currentIndex = 0;
      quizMode = false;
      renderCard();
      updateProgress();
    }

    function renderCard() {
      const stage = document.getElementById("stage");
      if (!filteredFacts.length) {
        stage.innerHTML = '<div class="empty-state"><p>No facts in this category yet.</p></div>';
        return;
      }
      const fact = filteredFacts[currentIndex];
      seenToday.add(fact.id);
      updateSeenCount();

      if (quizMode) {
        stage.innerHTML = `
          <div class="fact-card quiz">
            <p class="quiz-prompt">${escHtml(fact.quizPrompt)}</p>
            <div class="quiz-answer" id="answerBox">${escHtml(fact.quizAnswer)}</div>
            <div class="card-actions">
              <button class="buzzer reveal-button" id="revealBtn" type="button">
                <span class="btn-icon">&#9733;</span>
                <span class="btn-label">Reveal Answer</span>
              </button>
              <button class="buzzer back-button" id="backBtn" type="button">
                <span class="btn-icon">&#8617;</span>
                <span class="btn-label">Back to Fact</span>
              </button>
            </div>
          </div>`;
        document.getElementById("revealBtn").addEventListener("click", () => {
          document.getElementById("answerBox").classList.add("show");
          document.getElementById("revealBtn").style.display = "none";
        });
        document.getElementById("backBtn").addEventListener("click", () => {
          quizMode = false;
          renderCard();
        });
      } else {
        const catLabel = CATEGORY_LABELS[fact.category] || fact.category;
        stage.innerHTML = `
          <div class="fact-card">
            <div class="category-badge">${escHtml(catLabel)}</div>
            ${fact.image ? `<img class="fact-image" src="${escHtml(fact.image)}" alt="${escHtml(fact.imageAlt || '')}">` : ""}
            <p class="fact-text">${escHtml(fact.fact)}</p>
            <p class="why-line">${escHtml(fact.why)}</p>
            <div class="card-actions">
              <button class="buzzer quiz-button" id="quizBtn" type="button">
                <span class="btn-icon">?</span>
                <span class="btn-label">Quiz Me</span>
              </button>
            </div>
          </div>`;
        document.getElementById("quizBtn").addEventListener("click", () => {
          quizMode = true;
          renderCard();
        });
      }
    }

    function updateProgress() {
      const el = document.getElementById("progressText");
      if (!filteredFacts.length) { el.textContent = "No facts"; return; }
      const label = activeCategory === "all" ? "All Facts" : (CATEGORY_LABELS[activeCategory] || activeCategory);
      el.textContent = `${label} — ${currentIndex + 1} / ${filteredFacts.length}`;
    }

    function updateSeenCount() {
      document.getElementById("seenCount").textContent = `Seen today: ${seenToday.size}`;
    }

    function escHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.getElementById("prevButton").addEventListener("click", () => {
      if (!filteredFacts.length) return;
      quizMode = false;
      currentIndex = (currentIndex - 1 + filteredFacts.length) % filteredFacts.length;
      renderCard();
      updateProgress();
    });

    document.getElementById("nextButton").addEventListener("click", () => {
      if (!filteredFacts.length) return;
      quizMode = false;
      currentIndex = (currentIndex + 1) % filteredFacts.length;
      renderCard();
      updateProgress();
    });

    document.getElementById("randomButton").addEventListener("click", () => {
      if (!filteredFacts.length) return;
      quizMode = false;
      currentIndex = Math.floor(Math.random() * filteredFacts.length);
      renderCard();
      updateProgress();
    });

    // Service worker registration
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    function checkStreak() {
      const today = new Date().toISOString().slice(0, 10);
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toISOString().slice(0, 10);

      const lastVisit = localStorage.getItem('uk_last_visit');
      let streak = parseInt(localStorage.getItem('uk_streak') || '0', 10);
      let incremented = false;

      if (lastVisit === today) {
        // Already coun
