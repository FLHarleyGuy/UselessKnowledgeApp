<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Gold triangle outline -->
  <polygon points="28,158 66,88 104,158" fill="none" stroke="#ffd700" stroke-width="3.5"/>
  <!-- Magenta filled circle -->
  <circle cx="152" cy="38" r="12" fill="#cc00cc"/>
  <!-- White zigzag line -->
  <polyline points="108,115 124,97 140,115 156,97 172,115" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Red dot -->
  <circle cx="40" cy="34" r="7" fill="#ff1744"/>
  <!-- Gold rotated square -->
  <rect x="150" y="152" width="28" height="28" fill="none" stroke="#ffd700" stroke-width="3" transform="rotate(20 164 166)"/>
  <!-- Small blue-white plus -->
  <line x1="80" y1="42" x2="80" y2="62" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="52" x2="90" y2="52" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
