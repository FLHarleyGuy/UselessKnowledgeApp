<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Magnetic declination diagram</title>
  <desc id="desc">A map-style diagram showing true north, magnetic north, and the declination angle between them.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a3a5c"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e67e22"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1a3a5c; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 14px; }
      .grid { stroke: #d8e0e8; stroke-width: 1; }
      .axis { stroke: #1a3a5c; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow-navy); }
      .magnetic { stroke: #e67e22; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow-orange); }
      .dash { stroke: #9aa9b8; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="600" height="400" fill="#ffffff"/>
  <g opacity="0.65">
    <path class="grid" d="M80 60h440M80 110h440M80 160h440M80 210h440M80 260h440M80 310h440"/>
    <path class="grid" d="M120 40v300M180 40v300M240 40v300M300 40v300M360 40v300M420 40v300M480 40v300"/>
  </g>

  <circle cx="300" cy="300" r="8" fill="#1a3a5c"/>
  <text x="300" y="330" text-anchor="middle" class="small">Your location</text>

  <path class="dash" d="M300 300 L300 72"/>
  <path class="axis" d="M300 300 L300 78"/>
  <text x="300" y="48" text-anchor="middle" class="label">True north</text>
  <text x="300" y="68" text-anchor="middle" class="small">map meridian</text>

  <path class="magnetic" d="M300 300 L383 94"/>
  <text x="421" y="86" class="label">Magnetic north</text>
  <text x="421" y="106" class="small">compass points here</text>

  <path d="M300 246 A56 56 0 0 1 322 250" fill="none" stroke="#e67e22" stroke-width="4"/>
  <text x="348" y="238" class="label" fill="#e67e22">Declination angle</text>

  <rect x="70" y="350" width="460" height="32" rx="4" fill="#1a3a5c"/>
  <text x="300" y="371" text-anchor="middle" fill="#ffffff" class="small">Set a compass by correcting for the local declination angle.</text>
</svg>
