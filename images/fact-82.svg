<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
  <title id="title">1:24,000 map scale diagram</title>
  <desc id="desc">A paper map ruler showing that one inch on the map equals two thousand feet on the ground, with a one mile marker at 2.64 inches.</desc>
  <rect width="400" height="300" fill="#fafafa"/>
  <rect x="45" y="46" width="310" height="178" rx="4" fill="#fff" stroke="#333" stroke-width="2"/>
  <path d="M45 86h310M45 126h310M45 166h310M95 46v178M145 46v178M195 46v178M245 46v178M295 46v178" stroke="#ddd" stroke-width="1"/>
  <path d="M71 183c24-19 45-17 70-3 20 11 38 14 59 2 25-14 53-18 84 1" fill="none" stroke="#5f8f5f" stroke-width="8" stroke-linecap="round"/>
  <path d="M101 145c36-33 76-32 120-6 22 13 48 18 82 10" fill="none" stroke="#4d8bc5" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(70 245)">
    <line x1="0" y1="0" x2="112" y2="0" stroke="#333" stroke-width="4"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#333" stroke-width="3"/>
    <line x1="42" y1="-8" x2="42" y2="8" stroke="#333" stroke-width="2"/>
    <line x1="84" y1="-8" x2="84" y2="8" stroke="#333" stroke-width="2"/>
    <line x1="112" y1="-10" x2="112" y2="10" stroke="#333" stroke-width="3"/>
    <rect x="0" y="-22" width="112" height="8" fill="#ffd700"/>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="13" fill="#333">0</text>
    <text x="28" y="30" font-family="Arial, sans-serif" font-size="13" fill="#333">2,000 ft</text>
    <text x="77" y="30" font-family="Arial, sans-serif" font-size="13" fill="#333">4,000 ft</text>
  </g>
  <g transform="translate(70 88)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#111" stroke-width="4"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#111" stroke-width="2"/>
    <line x1="42" y1="-8" x2="42" y2="8" stroke="#111" stroke-width="2"/>
    <text x="52" y="5" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#333">1 inch on map</text>
  </g>
  <g transform="translate(70 118)">
    <line x1="0" y1="0" x2="111" y2="0" stroke="#ffd700" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#333" stroke-width="2"/>
    <line x1="111" y1="-11" x2="111" y2="11" stroke="#333" stroke-width="2"/>
    <text x="122" y="5" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#333">1 mile at 2.64 inches</text>
  </g>
  <text x="200" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#222">USGS 1:24,000 Scale</text>
  <text x="200" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">1 inch = 2,000 feet on the ground</text>
</svg>
