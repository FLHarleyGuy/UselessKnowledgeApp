<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
  <title id="title">Midday shadow and UV index</title>
  <desc id="desc">A person standing under a high midday sun with a short shadow and a UV index scale showing protection matters at 3 and above.</desc>
  <rect width="400" height="300" fill="#fafafa"/>
  <circle cx="72" cy="56" r="34" fill="#FFD700" stroke="#333" stroke-width="3"/>
  <g stroke="#333" stroke-width="3" stroke-linecap="round">
    <line x1="72" y1="9" x2="72" y2="0"/>
    <line x1="72" y1="103" x2="72" y2="114"/>
    <line x1="25" y1="56" x2="12" y2="56"/>
    <line x1="119" y1="56" x2="132" y2="56"/>
    <line x1="39" y1="23" x2="29" y2="13"/>
    <line x1="105" y1="89" x2="116" y2="100"/>
    <line x1="105" y1="23" x2="116" y2="13"/>
    <line x1="39" y1="89" x2="29" y2="100"/>
  </g>
  <path d="M64 116 C100 143 129 168 154 204" fill="none" stroke="#f2c94c" stroke-width="8" stroke-linecap="round" opacity=".55"/>
  <ellipse cx="184" cy="240" rx="58" ry="14" fill="#d8d8d8" stroke="#333" stroke-width="2"/>
  <g fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="203" cy="118" r="16" fill="#fff"/>
    <path d="M203 136 L203 188"/>
    <path d="M179 154 L227 154"/>
    <path d="M203 188 L184 230"/>
    <path d="M203 188 L225 230"/>
  </g>
  <path d="M211 232 C240 235 264 241 285 252" fill="none" stroke="#333" stroke-width="7" stroke-linecap="round" opacity=".35"/>
  <text x="150" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">shorter shadow = higher midday UV</text>
  <g transform="translate(292 82)">
    <rect x="0" y="0" width="80" height="132" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="40" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#333">UV INDEX</text>
    <rect x="13" y="38" width="54" height="14" fill="#78c257"/>
    <rect x="13" y="56" width="54" height="14" fill="#f2d34f"/>
    <rect x="13" y="74" width="54" height="14" fill="#f39c34"/>
    <rect x="13" y="92" width="54" height="14" fill="#d9534f"/>
    <text x="73" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">2</text>
    <text x="73" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">3</text>
    <text x="73" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">6</text>
    <text x="73" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">8</text>
    <path d="M8 63 L0 63" stroke="#333" stroke-width="3"/>
    <text x="40" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">3+ protect</text>
  </g>
</svg>
